# ai-memory 全栈 Docker Compose
# 一键启动 Qdrant + ai-memory：docker compose up -d
# 管理界面：http://localhost:8765/admin
#
# 首次启动后需建 Qdrant collection：
#   curl -X PUT http://localhost:6333/collections/memories \
#     -H 'Content-Type: application/json' \
#     -d '{"vectors":{"size":1024,"distance":"Cosine","on_disk":true},"quantization_config":{"scalar":{"type":"int8"}},"hnsw_config":{"m":8}}'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-memory-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    mem_limit: 512m
    volumes:
      - qdrant_data:/qdrant/storage

  ai-memory:
    build: .
    container_name: ai-memory
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_URL=http://host.docker.internal:11500/v1/embeddings
      - EMBEDDING_MODEL=qwen3-embedding:0.6b
      - LLM_URL=http://host.docker.internal:11434/v1/chat/completions
      - LLM_MODEL=deepseek-v4-flash
      - NODE_ENV=production
    volumes:
      - ai_memory_data:/opt/ai-memory/backups
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
  ai_memory_data:
